name: DevSecOps End to End Pipeline

on:
    # workflow_dispatch:
    push:
        branches: [main]

jobs:

    # CI (Continuous Integration with Security Scanning)

    code-quality:
        uses: ./.github/workflows/code-quality.yml

    secrets-scan:
        uses: ./.github/workflows/secrets-scan.yml

    scan-dockerfile:
        uses: ./.github/workflows/scan-dockerfile.yml

    # Dependency  & Unit Test (Only triggered if Phase 1 Static Scans pass successfully)
    dependency-check:
        needs: [code-quality, secrets-scan, scan-dockerfile]
        uses: ./.github/workflows/dependency-check.yml

    tests:
        needs: [code-quality, secrets-scan, scan-dockerfile]
        uses: ./.github/workflows/tests.yml

    # Build once the security scans are completed.
    build:
        needs: [dependency-check, tests]
        uses: ./.github/workflows/docker-build-push.yml
        secrets: inherit

    # Image Scan (Only triggered if Build is successful)
    trivy:
        needs: [build]
        uses: ./.github/workflows/image-scan.yml
        secrets: inherit

    # Deploy to Production (Only triggered if Image Scan is successful)
    deploy:
        needs: [trivy]
        uses: ./.github/workflows/deploy-to-server.yml
        secrets: inherit
