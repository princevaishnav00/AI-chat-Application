services:
  web: 
    image: ${DOCKERHUB_USER}/ai-chat-app:${DOCKER_TAG}
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    expose:
      - "5000"

  # Nginx reverse proxy container handling public port 80 traffic
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

 